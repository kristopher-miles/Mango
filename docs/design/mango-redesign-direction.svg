<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1470" viewBox="0 0 1440 1470" role="img" aria-labelledby="title desc">
  <title id="title">Mango interface design direction</title>
  <desc id="desc">Illustrative design board. A single Serving workspace shows provider configuration, immediately editable model rows, local permissions and resource qualification. A second panel demonstrates the Overview resource chart. All names, readiness states and metrics are illustrative, not live observations.</desc>
